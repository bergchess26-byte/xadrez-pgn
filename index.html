<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Estudo de Partida</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- CSS da aplicação -->
    <link rel="stylesheet" href="css/style.css?v=1">
</head>

<body>

<div class="container py-4">

    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="text-center mb-4">

        <h1 class="h3 mb-1">
            Estudo de Partida
        </h1>

        <p class="text-muted mb-3">
            Visualização e estudo de partidas de xadrez
        </p>

        <button
            type="button"
            class="btn btn-primary"
            data-bs-toggle="modal"
            data-bs-target="#importModal"
        >
            Importar PGN
        </button>

    </header>


    <!-- =====================================================
         MODAL DE IMPORTAÇÃO
         ===================================================== -->

    <div
        class="modal fade"
        id="importModal"
        tabindex="-1"
        aria-labelledby="importModalLabel"
        aria-hidden="true"
    >

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <!-- Cabeçalho do modal -->
                <div class="modal-header">

                    <h2
                        class="modal-title fs-5"
                        id="importModalLabel"
                    >
                        Importar partida PGN
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Fechar"
                    ></button>

                </div>


                <!-- Corpo -->
                <div class="modal-body">

                    <!-- Arquivo -->
                    <div class="mb-4">

                        <label
                            for="pgnFile"
                            class="form-label fw-semibold"
                        >
                            Arquivo PGN
                        </label>

                        <input
                            type="file"
                            class="form-control"
                            id="pgnFile"
                            accept=".pgn,text/plain"
                        >

                        <div class="form-text">
                            Selecione um arquivo com extensão .pgn.
                        </div>

                    </div>


                    <!-- Separador -->
                    <div class="d-flex align-items-center mb-4">

                        <div class="flex-grow-1 border-top"></div>

                        <span class="px-3 text-muted small">
                            ou cole o PGN
                        </span>

                        <div class="flex-grow-1 border-top"></div>

                    </div>


                    <!-- Texto PGN -->
                    <div class="mb-3">

                        <label
                            for="pgnText"
                            class="form-label fw-semibold"
                        >
                            Conteúdo PGN
                        </label>

                        <textarea
                            class="form-control font-monospace"
                            id="pgnText"
                            rows="10"
                            placeholder='[Event "Partida"]

[White "Jogador 1"]
[Black "Jogador 2"]
[Date "2026.08.30"]
[Result "1-0"]

1. e4 e5 2. Nf3 Nc6 3. Bb5 a6 1-0'
                        ></textarea>

                    </div>


                    <!-- Erro -->
                    <div
                        id="importError"
                        class="alert alert-danger d-none"
                        role="alert"
                    ></div>

                </div>


                <!-- Rodapé -->
                <div class="modal-footer">

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        id="importButton"
                        class="btn btn-primary"
                    >
                        Importar partida
                    </button>

                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         ÁREA DA PARTIDA
         ===================================================== -->

    <main id="gameSection" class="d-none">

        <!-- =================================================
             1. INFORMAÇÕES DA PARTIDA (COMPLETO NO TOPO)
             ================================================= -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <div class="d-flex justify-content-between align-items-start mb-3">

                    <div>

                        <h2
                            class="h5 mb-1"
                            id="eventName"
                        >
                            Partida
                        </h2>

                        <div
                            id="gameType"
                            class="text-muted small"
                        ></div>

                    </div>


                    <!-- Menu -->
                    <div class="dropdown">

                        <button
                            class="btn btn-outline-secondary btn-sm dropdown-toggle"
                            type="button"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                        >
                            Opções
                        </button>

                        <ul class="dropdown-menu dropdown-menu-end">

                            <li>
                                <button
                                    class="dropdown-item"
                                    type="button"
                                    id="restartButton"
                                >
                                    ↻ Reiniciar estudo
                                </button>
                            </li>

                            <li>
                                <button
                                    class="dropdown-item"
                                    type="button"
                                    id="newGameButton"
                                >
                                    Nova partida
                                </button>
                            </li>

                            <li>
                                <hr class="dropdown-divider">
                            </li>

                            <li>
                                <button
                                    class="dropdown-item text-danger"
                                    type="button"
                                    id="clearStorageButton"
                                >
                                    Limpar dados salvos
                                </button>
                            </li>

                        </ul>

                    </div>

                </div>


                <!-- Jogadores -->
                <div class="row g-3">

                    <div class="col-12 col-md-6">

                        <div class="player-box">

                            <div class="player-label">
                                Brancas
                            </div>

                            <div
                                id="whitePlayer"
                                class="player-name"
                            >
                                —
                            </div>

                        </div>

                    </div>


                    <div class="col-12 col-md-6">

                        <div class="player-box">

                            <div class="player-label">
                                Pretas
                            </div>

                            <div
                                id="blackPlayer"
                                class="player-name"
                            >
                                —
                            </div>

                        </div>

                    </div>

                </div>


                <!-- Data -->
                <div class="mt-3 text-muted small">

                    Data:

                    <strong
                        id="gameDate"
                        class="text-body"
                    >
                        —
                    </strong>

                </div>


                <!-- Resultado -->
                <div class="result-area mt-4 text-center">

                    <div
                        id="resultHidden"
                        class="text-muted mb-2"
                    >
                        Resultado oculto
                    </div>


                    <div
                        id="resultVisible"
                        class="d-none mb-2"
                    >

                        <strong id="gameResult">
                            —
                        </strong>

                        <div
                            id="winnerName"
                            class="small text-muted"
                        ></div>

                    </div>


                    <button
                        type="button"
                        id="showResultButton"
                        class="btn btn-outline-primary btn-sm"
                    >
                        Mostrar resultado
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             2. NOTAÇÃO (COMPLETO NO TOPO)
             ================================================= -->

        <section class="card shadow-sm mb-4">

            <div class="card-body">

                <h2 class="h6 text-center mb-3">
                    Sistema de notação
                </h2>


                <div
                    class="btn-group w-100"
                    role="group"
                    aria-label="Tipo de notação"
                >

                    <button
                        type="button"
                        class="btn btn-outline-primary"
                        data-notation="algebraic"
                    >
                        Algébrica
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-primary"
                        data-notation="algebraic-pt"
                    >
                        Algébrica PT
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-primary"
                        data-notation="descriptive"
                    >
                        Descritiva
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             3. ÁREA DIVIDIDA: TABULEIRO (ESQUERDA) | LANCES (DIREITA)
             ================================================= -->

        <div class="row g-4 align-items-start">

            <!-- TABULEIRO (ESQUERDA 50%) - FIXO AO ROLAR (STICKY) -->
            <div class="col-sm-6 col-lg-6 sticky-top" style="top: 20px; z-index: 10;">

                <section class="card shadow-sm">

                    <div class="card-body d-flex flex-column align-items-center justify-content-center">

                        <!-- Controle superior do Tabuleiro -->
                        <div class="w-100 d-flex justify-content-between align-items-center mb-3">

                            <span class="fw-semibold text-muted small">
                                Tabuleiro Visual
                            </span>

                            <button
                                type="button"
                                id="flipBoardButton"
                                class="btn btn-outline-secondary btn-sm"
                                title="Inverter visão (Brancas / Pretas)"
                            >
                                🔄 Inverter Visão
                            </button>

                        </div>

                        <!-- Container do Tabuleiro -->
                        <div id="boardContainer" class="w-100 d-flex justify-content-center">

                            <div id="board" class="chess-board">
                                <!-- O tabuleiro será renderizado aqui pelo JS -->
                            </div>

                        </div>

                        <!--<div id="boardOrientationLabel" class="text-muted small mt-2">
                            Visão: Brancas
                        </div>-->

                    </div>

                </section>

            </div>


            <!-- TABELA DE LANCES E CONTROLES (DIREITA 50%) -->
            <div class="col-sm-6 col-lg-6">

                <!-- Tabela de Lances (Cresce livremente com a página) -->
                <section class="card shadow-sm mb-4">

                    <div class="card-body p-0">

                        <div class="moves-header">

                            <h2 class="h6 mb-0">
                                Lances
                            </h2>

                        </div>


                        <div class="table-responsive">

                            <table class="table table-hover moves-table mb-0">

                                <thead>

                                    <tr>

                                        <th
                                            scope="col"
                                            class="move-number"
                                        >
                                            #
                                        </th>

                                        <th scope="col">
                                            Brancas
                                        </th>

                                        <th scope="col">
                                            Pretas
                                        </th>

                                    </tr>

                                </thead>


                                <tbody id="movesTableBody">

                                    <!--
                                        Os lances serão inseridos
                                        pelo JavaScript.
                                    -->

                                </tbody>

                            </table>

                        </div>

                    </div>

                </section>


                <!-- Controles dos Lances -->
                <section class="moves-controls card p-3 shadow-sm mb-4">

                    <div class="d-flex justify-content-between align-items-center mb-3">

                        <button
                            type="button"
                            id="previousMoveButton"
                            class="btn btn-outline-secondary"
                        >
                            ◀ Voltar
                        </button>


                        <div
                            id="progressLabel"
                            class="text-muted small text-center fw-semibold"
                            aria-live="polite"
                        ></div>


                        <button
                            type="button"
                            id="nextMoveButton"
                            class="btn btn-primary"
                        >
                            Avançar ▶
                        </button>

                    </div>


                    <!-- Ir Para o Lance -->
                    <div class="pt-2 border-top">

                        <label for="goToMoveInput" class="form-label small text-muted mb-1">
                            Ir para o lance:
                        </label>

                        <div class="input-group input-group-sm">

                            <input
                                type="number"
                                id="jumpMoveInput"
                                class="form-control"
                                placeholder="Ex: 10"
                                min="1"
                            >

                            <button
                                type="button"
                                id="jumpMoveButton"
                                class="btn btn-outline-primary"
                            >
                                Ir
                            </button>

                        </div>

                    </div>

                </section>


                <section>
         
                    <!-- =========================================================
                        CARD DE PERGUNTAS
                        ========================================================= -->

                    <div class="card shadow-sm mb-4" id="questionsCard">

                        <div class="card-body">

                            <!-- Pergunta -->
                            <div
                                id="questionContent"
                                class="mb-4"
                            ></div>


                            <!-- Controles -->
                            <div class="d-flex align-items-center justify-content-center gap-2 flex-wrap">

                                <!-- Voltar -->
                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="previousQuestionButton"
                                >
                                    ◀ Voltar
                                </button>


                                <!-- Ir para pergunta -->
                                <div class="input-group" style="width: 170px;">

                                    <input
                                        type="number"
                                        class="form-control"
                                        id="questionNumberInput"
                                        min="1"
                                        placeholder="Pergunta"
                                        aria-label="Número da pergunta"
                                    >

                                    <button
                                        type="button"
                                        class="btn btn-outline-primary"
                                        id="goToQuestionButton"
                                    >
                                        Ir
                                    </button>

                                </div>


                                <!-- Avançar -->
                                <button
                                    type="button"
                                    class="btn btn-primary"
                                    id="nextQuestionButton"
                                >
                                    Avançar ▶
                                </button>

                            </div>


                            <!-- Progresso -->
                            <div
                                id="questionProgressLabel"
                                class="text-center text-muted mt-3"
                            ></div>

                        </div>

                    </div>

                </section>

            </div>

        </div>

    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer class="text-center text-muted small py-3">

        Estudo de partida de xadrez

    </footer>

</div>


<!-- =========================================================
     BOOTSTRAP
     ========================================================= -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
></script>


<!-- =========================================================
     JAVASCRIPT DA APLICAÇÃO
     ========================================================= -->


<script src="js/board.js"></script>
<script src="js/notation.js"></script>

<script src="js/pgn.js"></script>
<script src="js/storage.js"></script>

<script src="js/questions.js"></script>
<script src="js/app.js"></script>

</body>
</html>
